          type: number
        hrProbability:
          type: number
        handedness:
          type: ["string", "null"]
        seasonStats:
          oneOf:
            - $ref: "#/components/schemas/SeasonBattingLine"
            - type: "null"
          description: The hitter's overall current-season batting line (real MLB season totals), or null when unavailable.
        hrScore:
          type: ["number", "null"]
        hrScoreComponents:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/HrScoreComponent"
        confidenceGrade:
          type: ["string", "null"]
          description: ML confidence grade (A+..D) when the ML scorer produced this row, else null.
        locked:
          type: boolean
          description: >-
            True when this row's premium analytics (hrScore, hrScoreComponents, confidenceGrade,
            insight) were withheld because the viewer is not an active member.
        modelSource:
          type: string
          enum: [ml, heuristic]
          description: Which model produced hrProbability / hrScore.
        bvp:
          oneOf:
            - $ref: "#/components/schemas/BatterVsPitcher"
            - type: "null"
        insight:
          oneOf:
            - $ref: "#/components/schemas/MatchupInsight"
            - type: "null"
          description: Natural-language "why the model likes this matchup" blurb, or null when no real angle exists.

