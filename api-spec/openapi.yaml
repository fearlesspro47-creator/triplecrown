          type: ["number", "null"]

    MatchupPitchMixRow:
      type: object
      description: >
        One of the opposing starter's pitch families crossed with this batter's
        real season split vs that family. Rows are ordered by pitcherUsage
        (most-thrown first). Batter columns are null when the hitter has no
        tracked at-bats vs the family.
      required: [pitchType, pitcherUsage]
      properties:
        pitchType:
          type: string
          description: Pitch-family code (FF, SI, FC, SL, CU, CH, FS, KN).
        pitchName:
          type: ["string", "null"]
        pitcherUsage:
          type: number
          description: Share of pitches the opposing starter throws of this family (0-1 decimal).
        atBats:
          type: ["integer", "null"]
          description: Batter's at-bats vs this pitch family this season (null if none).
        homeRuns:
          type: ["integer", "null"]
          description: Batter's home runs vs this pitch family this season.
        avg:
          type: ["number", "null"]
        iso:
          type: ["number", "null"]
        kRate:
          type: ["number", "null"]
          description: Batter's strikeouts per plate appearance vs this family (0-1 decimal).
        hardHitRate:
          type: ["number", "null"]
          description: Batter's hard-hit share vs this family (0-1 decimal).
        avgExitVelocity:
          type: ["number", "null"]

